<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chat System 🤖</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="header">

            <h1>🤖 AI Chat System</h1>

            <div class="header-buttons">

                <button id="newChatButton" class="new-chat-btn">
                    ➕ New Chat
                </button>

                <button id="historyButton" class="history-btn">
                    📜 History
                </button>

                <button id="clearChat" class="clear-btn">
                    🗑️ Clear Chat
                </button>

                <button id="exportChat" class="export-btn">
                    📥 Export
                </button>

            </div>

        </div>


        <!-- Chat History Panel -->
        <div id="historyPanel" class="history-panel">

            <div class="history-header">

                <h2>📜 Chat History</h2>

                <button id="closeHistory">
                    ✖️
                </button>

            </div>

            <div id="historyList"></div>

        </div>


        <!-- Chat Area -->
        <div id="chat"></div>


        <!-- Input Area -->
        <div class="input-area">

            <input
                type="text"
                id="message"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
